name: Release

# Builds the action and publishes the compiled tree to release/v1, then points
# the version tags at it. `dist/` is not committed on main - what consumers get
# from releasetools/mutex@v1 is built here, on the way past.
#
# A tag push cannot trigger this: the tag the workflow creates would collide
# with the one that triggered it. Dispatch with the version instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.3.0. package.json is bumped to match."
        required: true
      allow-lower-version:
        description: "Publish a version below the highest already released. For back-porting a fix to an older line."
        type: boolean
        default: false
      overwrite-existing:
        description: "Replace a version that has already been published, moving its tag and updating its GitHub release."
        type: boolean
        default: false

# Deny by default; each job grants only what it needs.
permissions: {}

env:
  # The agent plugin is validated by installing it, so these decide what
  # "it installs" means. Pinned rather than `latest`, because a release should
  # not be gated on a client published that morning. Bump through review.
  # renovate: datasource=npm depName=@anthropic-ai/claude-code
  CLAUDE_CODE_VERSION: "2.1.235"
  # renovate: datasource=npm depName=@openai/codex
  CODEX_VERSION: "0.147.0"

jobs:
  # Runs before anything is published, so a release that cannot be verified is
  # blocked rather than shipped and then reported.
  check-e2e-pin:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The verify job must test the release being published
        env:
          VERSION: ${{ inputs.version }}
          # Keep in step with the `uses:` in verify below.
          PINNED: v1
        run: |
          major="${VERSION%%.*}"
          if [ "$major" != "$PINNED" ]; then
            echo "::error::This release is $VERSION, but the verify job still pins releasetools/mutex@$PINNED, so nothing would check the published $major action. Add a $major job (uses: cannot take an expression, so it has to be written out), then update PINNED here."
            exit 1
          fi
          echo "verify pins @$PINNED and this release is $VERSION"

  publish:
    needs: check-e2e-pin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      major: ${{ steps.version.outputs.major }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          # A release build should not reuse another build's dependency cache.
          package-manager-cache: false

      - name: ✅ Check the version
        id: version
        env:
          # The script reads the repository's tags itself. It runs before
          # `npm ci`, so node_modules is not there and octokit is not an
          # option - it uses global fetch.
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ALLOW_LOWER: ${{ inputs.allow-lower-version }}
          OVERWRITE: ${{ inputs.overwrite-existing }}
        run: |
          set -euo pipefail

          args=(--version "$VERSION")
          [ "$ALLOW_LOWER" = "true" ] && args+=(--allow-lower-version)
          [ "$OVERWRITE" = "true" ] && args+=(--overwrite-existing)

          node scripts/check-release-version.mjs "${args[@]}"

      # The version lives in package.json because the action reports it at
      # runtime. Bumping it by hand before every release is a step to forget,
      # so the release does it - and pushes it to main, because a bump that
      # only exists on a throwaway branch would leave main claiming the old
      # version while the next release computed its bump from that stale value.
      - name: ⬆️ Bump the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          node -e '
            const fs = require("fs");
            const version = process.env.VERSION.replace(/^v/, "");

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            // The lock file carries the version twice, and npm rewrites both.
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            lock.version = version;
            if (lock.packages && lock.packages[""]) {
              lock.packages[""].version = version;
            }
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
          '

          mkdir -p bump
          cp package.json package-lock.json bump/
          echo "package.json is now $(node -p 'require("./package.json").version')"

      # Upsert rather than mirror: source-dir holds only the two files that
      # changed, and prune would otherwise read the rest of main as deleted.
      - name: 🔏 Push the bump to main, signed
        id: bump
        uses: releasetools/actions/signed-push@e03d8631693c67061fb9d1216cf23b1c370a992c # v0.0.6
        with:
          source-dir: bump
          target-repo: ${{ github.repository }}
          target-branch: main
          headline: "chore(release): ${{ inputs.version }}"
          prune: "false"
          token: ${{ github.token }}

      - name: 🔨 Lint, test and package
        run: |
          npm ci
          npm run lint
          npm test
          npm run package:release

      # signed-push commits onto an existing branch, so the release line has to
      # be there. Seeded from main the first time a major is published.
      - name: 🌱 Ensure the release branch exists
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail

          BRANCH="release/${MAJOR}"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
            echo "${BRANCH} already exists"
            exit 0
          fi

          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="${MAIN_SHA}" >/dev/null
          echo "Created ${BRANCH} from main at ${MAIN_SHA}"

      # createCommitOnBranch signs the commit server-side with the token it is
      # given, so the published commit is verified without a GPG key anywhere
      # near the runner. The trailers are the provenance: the built commit's
      # parent is the previous release, not the source it came from.
      #
      # The tags are applied here rather than by hand afterwards. force-tags
      # because the floating major has to move on every release; the version
      # tag only arrives here already existing when overwrite-existing was
      # passed, so the version check upstream is the gate, not this flag.
      - name: 🔏 Publish the tree, signed
        id: publish
        uses: releasetools/actions/signed-push@e03d8631693c67061fb9d1216cf23b1c370a992c # v0.0.6
        with:
          source-dir: publish
          target-repo: ${{ github.repository }}
          target-branch: release/${{ steps.version.outputs.major }}
          headline: "release: ${{ inputs.version }}"
          # signed-push appends Workflow-Commit and Published-By itself. That
          # names the checkout the workflow ran from, which is main before the
          # bump - this names the bump commit, which is the source of the
          # version actually published.
          body: |
            Source-Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.bump.outputs.commit-sha }}>
          prune: "true"
          # The exact version, and the floating major that follows every
          # release. One per line; signed-push trims and de-duplicates them.
          tags: |
            ${{ inputs.version }}
            ${{ steps.version.outputs.major }}
          force-tags: "true"
          token: ${{ github.token }}

      # The repository has published GitHub releases since v1.0.0, and the
      # notes people read live in RELEASE.md. Generated notes would be no use:
      # they are built from the commits reachable from the tag, and this tag
      # points into release/<major>, whose history is other releases.
      - name: 🚀 Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          node scripts/release-notes.mjs --version "$VERSION" > notes.md
          echo "Release notes:"
          sed 's/^/  /' notes.md

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md --title "Release $VERSION"
            echo "Updated the existing release"
          else
            gh release create "$VERSION" --notes-file notes.md --title "Release $VERSION"
            echo "Created the release"
          fi

      - name: 📝 Summary
        env:
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
          NEW_SHA: ${{ steps.publish.outputs.commit-sha }}
          NEW_URL: ${{ steps.publish.outputs.commit-url }}
          BUMP_SHA: ${{ steps.bump.outputs.commit-sha }}
        run: |
          {
            echo "## Published ${VERSION}"
            echo
            echo "Signed commit: [\`${NEW_SHA:0:12}\`](${NEW_URL})"
            echo
            echo "- \`${VERSION}\` and \`${MAJOR}\` point at it"
            echo "- bumped package.json on main in \`${BUMP_SHA:0:12}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Keep publish authority away from npm ci, tests, and every dependency
  # lifecycle script they can execute. This job receives only the signed tree
  # under the version tag and invokes npm directly.
  publish_npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      npm_available: ${{ steps.npm.outputs.available }}
    steps:
      - name: Checkout the signed release package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}
          path: package

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package/package.json
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # npm versions cannot be replaced. The command skips one that already
      # exists (including an overwrite of the Action release), refuses to
      # create retroactive packages before v1.3.0, and keeps a deliberately
      # lower backport from moving the registry's `latest` tag backwards.
      #
      # NPM_TOKEN is needed only to bootstrap the first package. Once the
      # package trusts release.yaml on npmjs.com, OIDC wins and this secret can
      # be deleted; provenance is generated from the same id-token permission.
      - name: 📦 Publish the CLI to npm
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        working-directory: package
        run: |
          set -euo pipefail

          expected="${VERSION#v}"

          # The npm package begins at v1.3.0. Re-running an older Action
          # release must not create a package that never existed at the time.
          case "$VERSION" in
            v1.0.*|v1.1.*|v1.2.*)
              echo "npm publishing starts at v1.3.0; skipping ${VERSION}."
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "status=not-applicable" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          name="$(node -p 'require("./package.json").name')"
          packaged="$(node -p 'require("./package.json").version')"
          if [ "$name" != "@releasetools/mutex" ]; then
            echo "::error::Refusing to publish ${name}; expected @releasetools/mutex"
            exit 1
          fi
          if [ "$packaged" != "$expected" ]; then
            echo "::error::Package version ${packaged} does not match ${VERSION}"
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

          # A successful Action overwrite may be retried after npm already
          # published. npm versions are immutable, so leave that one alone.
          if published="$(npm view "${name}@${expected}" version 2>/dev/null)"; then
            if [ "$published" != "$expected" ]; then
              echo "::error::npm returned unexpected version ${published}"
              exit 1
            fi
            echo "${name}@${expected} already exists; skipping npm publish."
            echo "status=existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep a deliberately lower backport from moving latest backwards.
          tag=latest
          latest="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
          if [ -n "$latest" ] && [ "$latest" != "$expected" ]; then
            lower="$(printf '%s\n' "$expected" "$latest" | sort -V | head -n 1)"
            [ "$lower" = "$expected" ] && tag=backport
          fi

          npm publish . \
            --access public \
            --tag "$tag" \
            --provenance \
            --registry https://registry.npmjs.org
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: 📝 npm summary
        env:
          NPM_AVAILABLE: ${{ steps.npm.outputs.available }}
          NPM_STATUS: ${{ steps.npm.outputs.status }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$NPM_AVAILABLE" = "true" ]; then
            echo "npm package (${NPM_STATUS}): [\`@releasetools/mutex@${VERSION#v}\`](https://www.npmjs.com/package/@releasetools/mutex/v/${VERSION#v})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm package: not applicable before v1.3.0" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Install the exact package from the public registry, rather than exercising
  # publish/ in the workspace, so this proves npm received a runnable CLI.
  verify-npm:
    if: needs.publish_npm.outputs.npm_available == 'true'
    needs: publish_npm
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # This job intentionally has no checkout, so package.json is unavailable.
          node-version: "24"
          package-manager-cache: false

      - name: ✅ Install and verify the npm CLI
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          expected="${VERSION#v}"
          package="@releasetools/mutex@${expected}"

          # npm may acknowledge a publish before the package is visible to
          # installs. Retry the exact version for roughly two minutes, asking
          # npm to revalidate its registry metadata on every attempt.
          attempt=1
          max_attempts=12
          until npm install --global --prefer-online "$package"; do
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::npm could not install ${package} after ${max_attempts} attempts"
              exit 1
            fi
            echo "::notice::npm install attempt ${attempt}/${max_attempts} failed; retrying in 10 seconds"
            sleep 10
            attempt=$((attempt + 1))
          done

          ran="$(mutex version)"
          if [ "$ran" != "$expected" ]; then
            echo "::error::npm installed mutex $ran, but this release is $expected"
            exit 1
          fi
          echo "npm installed mutex $ran"

  # Exercise the public npm package through the documented mise path, using
  # neither the assembled workspace tree nor a runner-global Node/npm install.
  # verify-npm runs first, so a package that is still propagating is retried
  # there rather than turning this into a second registry-propagation test.
  verify-mise:
    if: needs.publish_npm.outputs.npm_available == 'true'
    needs: [publish_npm, verify-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.8"
          # mise-v2026.8.8-linux-x64 from the release's SHASUMS256.txt.
          sha256: "1fce52a3656cf14bef6feeb9f0b90d545126a0bb598f0a69afbb9e4702f8f3e3"
          install: "false"
          cache: "false"
          add_shims_to_path: "false"
          env: "false"
          export_path: "false"

      - name: ✅ Install and verify the mise CLI
        env:
          VERSION: ${{ inputs.version }}
          MISE_VERIFY_ROOT: ${{ runner.temp }}/mutex-mise
          MISE_DATA_DIR: ${{ runner.temp }}/mutex-mise/data
          MISE_CACHE_DIR: ${{ runner.temp }}/mutex-mise/cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mutex-mise/config
          MISE_STATE_DIR: ${{ runner.temp }}/mutex-mise/state
          MISE_GLOBAL_CONFIG_FILE: ${{ runner.temp }}/mutex-mise/config/config.toml
        run: |
          set -euo pipefail

          expected="${VERSION#v}"
          mkdir -p \
            "$MISE_VERIFY_ROOT" \
            "$MISE_DATA_DIR" \
            "$MISE_CACHE_DIR" \
            "$MISE_CONFIG_DIR" \
            "$MISE_STATE_DIR"

          # The npm backend installs with mise's embedded package manager, but
          # does not add the runtime the package needs. Declaring both in one
          # command makes mise install Node first. The low-download exception
          # is scoped to mutex and leaves the guard in place for dependencies.
          mise --cd "$MISE_VERIFY_ROOT" use --global \
            node@24 \
            "npm:@releasetools/mutex[allow_low_downloads=true]@${expected}"

          node_path="$(mise --cd "$MISE_VERIFY_ROOT" which node)"
          mutex_path="$(mise --cd "$MISE_VERIFY_ROOT" which mutex)"
          for path in "$node_path" "$mutex_path"; do
            case "$path" in
              "$MISE_DATA_DIR"/*) ;;
              *)
                echo "::error::mise resolved ${path} outside ${MISE_DATA_DIR}"
                exit 1
                ;;
            esac
          done

          ran="$(mise --cd "$MISE_VERIFY_ROOT" exec -- mutex version)"
          if [ "$ran" != "$expected" ]; then
            echo "::error::mise installed mutex $ran, but this release is $expected"
            exit 1
          fi

          mise --cd "$MISE_VERIFY_ROOT" exec -- mutex help >/dev/null
          echo "mise installed mutex $ran at $mutex_path with $node_path"

  # Proves the published action works, by using it the way a consumer would.
  #
  # This runs after the tags have moved, because `uses:` cannot reference the
  # version being published - only the floating major. So a failure here means
  # a published release that needs fixing forward, which is still far better
  # than finding out from somebody else's workflow.
  verify:
    if: startsWith(inputs.version, 'v1.')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🔒 Acquire Lock (and auto-release on completion)
        id: lock
        uses: releasetools/mutex@v1
        env:
          MUTEX_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: "lock"
          id: "verify-release-v1"
          reason: "Verify the published ${{ inputs.version }}"

      # The point of this job. The tags moved a moment ago, but `uses:`
      # resolves through GitHub's action cache, which is a different system -
      # no amount of waiting proves the runner was handed the new code. Asking
      # the action which build it is turns "probably fresh" into something
      # checked.
      - name: ✅ Verify the published build is the one under test
        env:
          RAN: ${{ steps.lock.outputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          expected="${VERSION#v}"

          if [ -z "$RAN" ]; then
            echo "::error::The action reported no version. Either v1 resolved to a build from before the version output existed, or the action failed before reporting."
            exit 1
          fi

          if [ "$RAN" != "$expected" ]; then
            echo "::error::v1 ran mutex $RAN, but this release is $expected. The tag move may not have reached the action cache yet - re-run this job."
            exit 1
          fi

          echo "v1 ran mutex $RAN, matching $VERSION"

      - name: ⏳ Mock action - wait 5 seconds and then continue
        run: sleep 5

  # The agent plugin carries a version of its own, because Claude Code and Codex
  # install it from releasetools/agent-plugins rather than from a mutex tag. So
  # most releases find it already published and stop here; a release that
  # follows a change to `skills/`, `commands/` or the manifests publishes it.
  #
  # Assembly happens in this job, which holds no credentials, and publication in
  # the next one, which holds a cross-repository write token and runs nothing
  # from this repository. That split is the point: a token that can write to
  # every consumer's plugin should never be in the same job as `npm ci`.
  package_plugin:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job installs the client CLIs, which run their packages' own
          # install scripts. Nothing here uses git after the checkout, so the
          # token does not stay in .git/config where those scripts could read
          # it.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      # No `npm ci`. The packaging and the checks it runs are Node's standard
      # library and nothing else, and the tests already ran in the publish job
      # this depends on - so a release that could not be verified never gets
      # this far.
      - name: 📦 Assemble the standalone plugin
        id: package
        run: |
          set -euo pipefail

          npm run plugin:package -- --out "${RUNNER_TEMP}/plugin"

          version="$(node -p "require('${RUNNER_TEMP}/plugin/.claude-plugin/plugin.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Assembled the mutex plugin ${version}"

      - name: 📦 Install the pinned client CLIs
        run: |
          npm install --global \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" \
            "@openai/codex@${CODEX_VERSION}"

      - name: ✅ Validate the plugin with Claude Code
        run: claude plugin validate --strict "${RUNNER_TEMP}/plugin"

      # Codex installs out of a marketplace rather than out of a directory, so
      # the check needs one. A throwaway catalog here means a manifest Codex
      # rejects fails before any token is minted, rather than after.
      - name: ✅ Install the plugin with Codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          probe="${RUNNER_TEMP}/probe"
          mkdir -p "${probe}/.agents/plugins" "${probe}/plugins" "$CODEX_HOME"
          cp -R "${RUNNER_TEMP}/plugin" "${probe}/plugins/mutex"
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/probe/.agents/plugins/marketplace.json`,
              JSON.stringify({
                name: "probe",
                interface: { displayName: "probe" },
                plugins: [{
                  name: "mutex",
                  source: { source: "local", path: "./plugins/mutex" },
                  policy: { installation: "AVAILABLE", authentication: "ON_INSTALL" },
                  category: "Developer Tools",
                }],
              }, null, 2));
          '

          codex plugin marketplace add "$probe"
          codex plugin add mutex@probe

          installed="$(codex plugin list --json | node -e '
            const { installed } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const found = installed.find((row) => row.name === "mutex");
            process.stdout.write(found ? found.version : "");
          ')"
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::Codex installed mutex '${installed}', but the assembled plugin is ${VERSION}"
            exit 1
          fi
          echo "Codex installed mutex ${installed}"

      # include-hidden-files, because the whole plugin hangs off .claude-plugin/
      # and .codex-plugin/ and the default is to drop them silently.
      - name: ⬆️ Upload the verified plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutex-plugin
          path: ${{ runner.temp }}/plugin
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Writes into releasetools/agent-plugins. It runs nothing out of this
  # repository - no `npm ci`, no dependency of the Action or the CLI - only the
  # marketplace's own checked-in publisher and the two pinned client CLIs,
  # against a directory assembled and verified elsewhere.
  #
  # Installing those CLIs does run their packages' install scripts, so it
  # happens before the token is minted, and the checkout is told not to keep
  # the token in .git/config. The token's whole life on this runner is the
  # publisher, the validators and signed-push.
  publish_plugin:
    needs: [publish, package_plugin]
    runs-on: ubuntu-latest
    permissions: {}
    # One mutex publication at a time. A simultaneous publication of some other
    # plugin is caught by signed-push instead, which commits against the target
    # HEAD it read: the loser fails rather than overwriting, and re-running from
    # the new HEAD converges.
    concurrency:
      group: publish-agent-plugin-mutex
      cancel-in-progress: false
    steps:
      - name: ⬇️ Download the verified plugin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutex-plugin
          path: plugin

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      # First, deliberately: this runs two third-party packages' install
      # scripts, and the job has no cross-repository token yet for them to
      # find. The cost is one npm install on a release that publishes nothing.
      - name: 📦 Install the pinned client CLIs
        run: |
          npm install --global \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" \
            "@openai/codex@${CODEX_VERSION}"

      # Scoped to the marketplace alone. The release App installs on several
      # repositories; this token can write to exactly one of them.
      #
      # It needs Contents: write there. signed-push sends every file in the
      # tree, so if GitHub ever refuses the commit over
      # `.github/workflows/validate.yml`, the App needs Workflows: write as
      # well - that file is republished unchanged on every publication.
      - name: 🔑 Mint a token for the marketplace
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-plugins

      - name: Checkout the marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/agent-plugins
          ref: main
          path: marketplace
          token: ${{ steps.app-token.outputs.token }}
          # The token is for this fetch and for signed-push, which takes it as
          # an input. Nothing here runs git against the remote afterwards.
          persist-credentials: false

      # The publisher refuses a version that goes backwards and refuses to
      # change a version somebody has already installed. An unchanged plugin is
      # the ordinary case, and it writes nothing.
      - name: 📚 Stage the publication
        id: stage
        env:
          VERSION: ${{ needs.package_plugin.outputs.version }}
        run: |
          set -euo pipefail

          node marketplace/scripts/publish-plugin.mjs \
            --root marketplace --plugin plugin --json > result.json
          cat result.json

          status="$(node -p 'require("./result.json").status')"
          previous="$(node -p 'require("./result.json").previousVersion ?? ""')"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

          if [ "$status" = "unchanged" ]; then
            echo "::notice::mutex ${VERSION} is already in the marketplace; nothing to publish."
          fi

      - name: ✅ Check the cross-client invariants
        if: steps.stage.outputs.status == 'published'
        run: node marketplace/scripts/validate-marketplaces.mjs --root marketplace

      - name: ✅ Validate the staged marketplace with Claude Code
        if: steps.stage.outputs.status == 'published'
        run: claude plugin validate --strict marketplace

      # The last check before anyone else can get this: install mutex the way a
      # user installs it, out of the tree that is about to be committed.
      - name: ✅ Install mutex@releasetools from the staged marketplace
        if: steps.stage.outputs.status == 'published'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          VERSION: ${{ needs.package_plugin.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          staged="${PWD}/marketplace"

          claude plugin marketplace add "$staged"
          claude plugin install mutex@releasetools
          claude_version="$(claude plugin list --json | node -e '
            const rows = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const found = rows.find((row) => row.id === "mutex@releasetools");
            process.stdout.write(found ? found.version : "");
          ')"

          codex plugin marketplace add "$staged"
          codex plugin add mutex@releasetools
          codex_version="$(codex plugin list --json | node -e '
            const { installed } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const found = installed.find((row) => row.name === "mutex");
            process.stdout.write(found ? found.version : "");
          ')"

          if [ "$claude_version" != "$VERSION" ] || [ "$codex_version" != "$VERSION" ]; then
            echo "::error::Publishing mutex ${VERSION}, but Claude Code installed '${claude_version}' and Codex installed '${codex_version}'"
            exit 1
          fi
          echo "Both clients installed mutex ${VERSION} from the staged marketplace"

      # The whole tree, pruned: the marketplace is a generated repository, and
      # a file left behind by a plugin that was withdrawn is a file an agent
      # still reads. force-tags is off, so mutex-v<version> is created once and
      # a re-run over an existing version leaves the tag where it is.
      - name: 🔏 Publish the marketplace, signed
        id: marketplace
        if: steps.stage.outputs.status == 'published'
        uses: releasetools/actions/signed-push@e03d8631693c67061fb9d1216cf23b1c370a992c # v0.0.6
        with:
          source-dir: marketplace
          target-repo: ${{ github.repository_owner }}/agent-plugins
          target-branch: main
          headline: "publish mutex v${{ needs.package_plugin.outputs.version }}"
          body: |
            Source-Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}>
          prune: "true"
          tags: mutex-v${{ needs.package_plugin.outputs.version }}
          force-tags: "false"
          token: ${{ steps.app-token.outputs.token }}

      - name: 📝 Marketplace summary
        env:
          STATUS: ${{ steps.stage.outputs.status }}
          PREVIOUS: ${{ steps.stage.outputs.previous }}
          VERSION: ${{ needs.package_plugin.outputs.version }}
          COMMIT_URL: ${{ steps.marketplace.outputs.commit-url }}
          COMMIT_SHA: ${{ steps.marketplace.outputs.commit-sha }}
        run: |
          {
            if [ "$STATUS" = "published" ]; then
              echo "## Published the mutex plugin ${VERSION}"
              echo
              echo "- \`mutex-v${VERSION}\` in [releasetools/agent-plugins](https://github.com/${GITHUB_REPOSITORY_OWNER}/agent-plugins), commit [\`${COMMIT_SHA:0:12}\`](${COMMIT_URL})"
              echo "- previously published: ${PREVIOUS:-none}"
            else
              echo "## Agent plugin: nothing to publish"
              echo
              echo "The marketplace already carries mutex ${VERSION}. Bump the version in both plugin manifests to publish a new one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
