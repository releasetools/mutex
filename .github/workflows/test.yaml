name: "Test mutex lock action"

on:
  pull_request:
    types: [opened, synchronize]

# Deny by default, so a job added later has to say what it needs rather than
# inheriting a token that can write.
permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run tests
        run: |
          npm install
          npm run build
          npm run lint
          npm test

  postgres-integration:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: mutex_test
          POSTGRES_USER: mutex
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mutex -d mutex_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run PostgreSQL integration tests
        env:
          MUTEX_TEST_DATABASE_URL: postgresql://mutex@localhost:5432/mutex_test
        run: |
          npm ci
          npm run typecheck
          NODE_OPTIONS=--experimental-vm-modules npx jest __tests__/database.integration.test.ts --runInBand

  test01:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      # The action comments on the pull request when it takes and drops a lock.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # dist/ is built at release time, not committed, so `uses: ./` below has
      # nothing to run until this step produces it. Local actions are read from
      # the workspace when their step runs - unlike remote ones, which are
      # fetched during "Set up job" - so building here is soon enough.
      - name: 🔨 Build the action
        run: |
          npm ci
          npm run build

      - name: 🔒 Acquire Lock (and auto-release on completion)
        uses: ./
        with:
          command: "lock"
          id: "test-lock1"
          reason: "Test mutex action: test01"
          MUTEX_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: "C09CF3TR60P"

      - name: ⏳ Mock action - wait 5 seconds and then continue
        run: sleep 5

  test02:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      # The action comments on the pull request when it takes and drops a lock.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # dist/ is built at release time, not committed, so `uses: ./` below has
      # nothing to run until this step produces it. Local actions are read from
      # the workspace when their step runs - unlike remote ones, which are
      # fetched during "Set up job" - so building here is soon enough.
      - name: 🔨 Build the action
        run: |
          npm ci
          npm run build

      - name: 🔒 Acquire Lock
        uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUTEX_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          command: "lock"
          id: "test-lock2"
          auto-release: false
          reason: "Test mutex action: test02"
          slack-channel: "C09CF3TR60P"

      - name: ⏳ Mock action - wait 5 seconds and then continue
        run: sleep 5

      - name: 🔓 Release Lock
        uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUTEX_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          command: "release"
          id: "test-lock2"

  test03:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      # The action comments on the pull request when it takes and drops a lock.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # dist/ is built at release time, not committed, so `uses: ./` below has
      # nothing to run until this step produces it. Local actions are read from
      # the workspace when their step runs - unlike remote ones, which are
      # fetched during "Set up job" - so building here is soon enough.
      - name: 🔨 Build the action
        run: |
          npm ci
          npm run build

      - name: 🔒 Acquire Lock (and auto-release on completion)
        uses: ./
        env:
          MUTEX_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: "lock"
          id: "test-lock3"
          reason: "Test mutex action: test03"

      - name: ⏳ Mock action - wait 5 seconds and then continue
        run: sleep 5
