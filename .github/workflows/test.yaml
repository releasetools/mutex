name: "Test mutex lock action"

on:
  pull_request:
    types: [opened, synchronize]

# Deny by default, so a job added later has to say what it needs rather than
# inheriting a token that can write.
permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run tests
        run: |
          npm install
          npm run build
          npm run lint
          npm test

  test01:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      # The action comments on the pull request when it takes and drops a lock.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔒 Acquire Lock (and auto-release on completion)
        uses: ./
        with:
          command: "lock"
          id: "test-lock1"
          reason: "Test mutex action: test01"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: "C09CF3TR60P"

      - name: ⏳ Mock action - wait 5 seconds and then continue
        run: sleep 5

  test02:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      # The action comments on the pull request when it takes and drops a lock.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔒 Acquire Lock
        uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          command: "lock"
          id: "test-lock2"
          auto-release: false
          reason: "Test mutex action: test02"
          slack-channel: "C09CF3TR60P"

      - name: ⏳ Mock action - wait 5 seconds and then continue
        run: sleep 5

      - name: 🔓 Release Lock
        uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          command: "release"
          id: "test-lock2"

  test03:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      # The action comments on the pull request when it takes and drops a lock.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔒 Acquire Lock (and auto-release on completion)
        uses: ./
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: "lock"
          id: "test-lock3"
          reason: "Test mutex action: test03"

      - name: ⏳ Mock action - wait 5 seconds and then continue
        run: sleep 5
